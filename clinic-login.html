<!DOCTYPE html>  /* hi hi */
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clinic Login — Curelith</title>
  <meta name="description" content="Clinic administrator login for Curelith — manage all your clinic's doctors and appointments in one place." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: #0a0f1e;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated gradient blobs */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 600px 400px at 20% 20%, rgba(99,102,241,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 500px 400px at 80% 80%, rgba(16,185,129,0.14) 0%, transparent 70%),
        radial-gradient(ellipse 400px 300px at 60% 10%, rgba(139,92,246,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Floating particles */
    .particles {
      position: fixed; inset: 0; pointer-events: none; overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 3px; height: 3px;
      border-radius: 50%;
      background: rgba(99,102,241,0.5);
      animation: float linear infinite;
    }
    @keyframes float {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    .card {
      position: relative;
      width: 440px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 48px 44px;
      box-shadow:
        0 32px 80px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.06);
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-row {
      display: flex; align-items: center; gap: 12px; margin-bottom: 36px;
    }
    .logo-icon {
      width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; box-shadow: 0 8px 24px rgba(99,102,241,0.4);
    }
    .logo-text { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
    .logo-badge {
      margin-left: auto;
      font-size: 10px; font-weight: 600; letter-spacing: 1px;
      color: #6366f1; background: rgba(99,102,241,0.12);
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 6px; padding: 3px 8px; text-transform: uppercase;
    }

    h1 { font-size: 26px; font-weight: 700; color: #f1f5f9; margin-bottom: 6px; }
    .subtitle { font-size: 14px; color: rgba(255,255,255,0.45); margin-bottom: 32px; }

    .field { margin-bottom: 20px; }
    label { display: block; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.5); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 8px; }

    .input-wrap {
      position: relative;
    }
    .input-wrap svg {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: rgba(255,255,255,0.3); pointer-events: none;
    }
    input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: #f1f5f9;
      font-family: inherit;
      font-size: 15px;
      padding: 13px 14px 13px 42px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    input::placeholder { color: rgba(255,255,255,0.25); }
    input:focus {
      border-color: rgba(99,102,241,0.6);
      background: rgba(255,255,255,0.07);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }
    input.error { border-color: rgba(239,68,68,0.7); }

    .eye-btn {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; padding: 4px;
      color: rgba(255,255,255,0.35);
    }
    .eye-btn:hover { color: rgba(255,255,255,0.7); }

    .error-msg {
      display: none;
      margin-top: 16px;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px; color: #f87171;
    }
    .error-msg.visible { display: block; }

    .btn {
      width: 100%;
      margin-top: 28px;
      padding: 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none; border-radius: 12px;
      color: #fff; font-family: inherit; font-size: 15px; font-weight: 600;
      cursor: pointer; letter-spacing: 0.3px;
      box-shadow: 0 8px 28px rgba(99,102,241,0.35);
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      position: relative; overflow: hidden;
    }
    .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 12px 36px rgba(99,102,241,0.45); }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn .spinner {
      display: none; width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }
    .btn.loading .btn-text { display: none; }
    .btn.loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer-link {
      text-align: center; margin-top: 24px;
      font-size: 13px; color: rgba(255,255,255,0.35);
    }
    .footer-link a { color: #818cf8; text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      .card { width: 95vw; padding: 36px 28px; }
    }
  </style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="card">
  <div class="logo-row">
    <div class="logo-icon">🏥</div>
    <span class="logo-text">Curelith</span>
    <span class="logo-badge">Clinic</span>
  </div>

  <h1>Clinic Login</h1>
  <p class="subtitle">Sign in to manage your clinic's doctors and appointments</p>

  <form id="loginForm" autocomplete="off">
    <div class="field">
      <label for="clinicIdInput">Clinic ID</label>
      <div class="input-wrap">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
        </svg>
        <input id="clinicIdInput" type="text" placeholder="e.g. CLINIC-APOLLO-001" autocomplete="off" />
      </div>
    </div>

    <div class="field">
      <label for="passwordInput">Password</label>
      <div class="input-wrap">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
        <input id="passwordInput" type="password" placeholder="Enter clinic password" autocomplete="off" />
        <button type="button" class="eye-btn" id="eyeBtn" title="Toggle visibility">
          <svg id="eyeIcon" width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <button type="submit" class="btn" id="loginBtn">
      <span class="btn-text">Sign In to Clinic</span>
      <div class="spinner"></div>
    </button>
  </form>

  <p class="footer-link">
    Are you a doctor? <a href="doctor-login.html">Doctor Login →</a>
  </p>
</div>

<script>
  const API_BASE = 'https://api.curelith.com';

  // Particles
  const container = document.getElementById('particles');
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.cssText = `
      left: ${Math.random() * 100}%;
      animation-duration: ${6 + Math.random() * 10}s;
      animation-delay: ${Math.random() * 8}s;
      width: ${2 + Math.random() * 3}px;
      height: ${2 + Math.random() * 3}px;
      opacity: ${0.3 + Math.random() * 0.5};
      background: ${Math.random() > 0.5 ? 'rgba(99,102,241,0.6)' : 'rgba(16,185,129,0.5)'};
    `;
    container.appendChild(p);
  }

  // Eye toggle
  const eyeBtn = document.getElementById('eyeBtn');
  const pwInput = document.getElementById('passwordInput');
  eyeBtn.addEventListener('click', () => {
    const show = pwInput.type === 'password';
    pwInput.type = show ? 'text' : 'password';
    eyeBtn.innerHTML = show
      ? `<svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
           <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
         </svg>`
      : `<svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
           <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
           <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
         </svg>`;
  });

  // Auto-redirect if session is active
  const clinicIdVal = localStorage.getItem('clinic_id');
  const clinicPwVal = localStorage.getItem('clinic_password');
  const clinicExpiry = localStorage.getItem('clinic_expiry');
  if (clinicIdVal && clinicPwVal && clinicExpiry && Date.now() < parseInt(clinicExpiry)) {
    window.location.href = 'clinic-dashboard.html';
  } else {
    // Clear old session info if expired
    ['clinic_id','clinic_password','clinic_name','clinic_location','clinic_expiry'].forEach(k => localStorage.removeItem(k));
  }

  // Form submit
  const form = document.getElementById('loginForm');
  const btn = document.getElementById('loginBtn');
  const errorMsg = document.getElementById('errorMsg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const clinicId = document.getElementById('clinicIdInput').value.trim();
    const password = pwInput.value;

    errorMsg.classList.remove('visible');
    if (!clinicId || !password) {
      showError('Please enter your Clinic ID and password.');
      return;
    }

    btn.classList.add('loading');
    btn.disabled = true;

    try {
      const res = await fetch(`${API_BASE}/doctor/clinic/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ clinic_id: clinicId, password })
      });
      const data = await res.json();

      if (res.ok && data.status === 'success') {
        localStorage.setItem('clinic_id', data.clinic.clinic_id);
        localStorage.setItem('clinic_password', password);
        localStorage.setItem('clinic_name', data.clinic.name);
        localStorage.setItem('clinic_location', data.clinic.location);
        localStorage.setItem('clinic_expiry', (Date.now() + 24 * 60 * 60 * 1000).toString()); // 24 hours
        window.location.href = 'clinic-dashboard.html';
      } else {
        showError(data.error || 'Invalid credentials. Please try again.');
      }
    } catch (err) {
      showError('Network error. Please check your connection.');
    } finally {
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  });

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('visible');
  }
</script>
</body>
</html>
