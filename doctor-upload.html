<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Portal — Curelith Clinical Intake</title>
  
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="icon" href="assets/favicon-32x32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <!-- Google Fonts: Fraunces, Inter, IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --void:       #0F1B19;
      --void-soft:  #16241F;
      --paper:      #F5F3ED;
      --card:       #FFFFFF;
      --card-tint:  #EDEAE0;
      --ink:        #14201D;
      --ink-soft:   #4D5C57;
      --pine:       #1E423D;
      --pine-light: #2E5C54;
      --mist:       #8FA89F;
      --mist-dim:   #5C7A71;
      --line:       #DCD7C8;
      --line-dark:  rgba(255,255,255,0.09);
      --clay:       #D4824A;
      --clay-deep:  #B5642F;
      --gold:       #E8C77B;

      --serif: "Fraunces", Georgia, serif;
      --sans:  "Inter", -apple-system, sans-serif;
      --mono:  "IBM Plex Mono", monospace;

      --max: 680px;
      --radius: 16px;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
      font-size: 15px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .wrap { max-width: var(--max); margin: 0 auto; padding: 0 20px; width: 100%; }

    /* HEADER */
    header {
      background: var(--void);
      color: #fff;
      padding: 16px 0;
      border-bottom: 1px solid var(--line-dark);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-inner {
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand {
      display: flex; align-items: center; gap: 9px;
      font-family: var(--serif); font-size: 19px; font-weight: 600; color: #fff; text-decoration: none;
    }
    .brand img { width: 28px; height: 28px; }

    .doc-pill {
      font-family: var(--mono);
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: rgba(30,66,61,0.2);
      border: 1px solid var(--pine-light);
      color: var(--gold);
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    /* MAIN FORM */
    main { padding: 30px 0 48px; }

    .upload-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 20px 40px -20px rgba(15,27,25,0.08);
      overflow: hidden;
    }

    .patient-strip {
      padding: 20px 24px;
      background: var(--card-tint);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .patient-strip .label {
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--pine);
      font-weight: 700;
      display: block;
    }
    .patient-strip .name {
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 600;
      color: var(--ink);
      margin-top: 2px;
    }
    .patient-strip .id {
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--ink-soft);
      margin-top: 2px;
    }
    .patient-strip .blood {
      font-size: 18px;
      font-weight: 800;
      color: #DC2626;
      background: #FEF2F2;
      border: 1px solid #FECACA;
      padding: 6px 12px;
      border-radius: 10px;
    }

    .form-content {
      padding: 26px 24px;
    }

    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block;
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-soft);
      margin-bottom: 7px;
      font-weight: 600;
    }
    .form-label .req { color: #DC2626; }

    .input-field {
      width: 100%;
      font-family: var(--sans);
      font-size: 14.5px;
      color: var(--ink);
      background: #FAFAFA;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 12px 14px;
      outline: none;
      transition: all .2s ease;
    }
    .input-field:focus {
      background: #FFFFFF;
      border-color: var(--pine);
      box-shadow: 0 0 0 3px rgba(30,66,61,0.08);
    }

    textarea.input-field { resize: vertical; min-height: 85px; }

    .btn-submit {
      background: var(--clay);
      color: #241208;
      border: none;
      border-radius: 10px;
      padding: 14px 20px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 10px 24px -10px rgba(212,130,74,0.55);
      transition: background .2s ease;
    }
    .btn-submit:hover { background: var(--clay-deep); }
    .btn-submit:active { transform: translateY(1px); }

    /* FOOTER */
    footer {
      background: var(--void-soft);
      color: var(--mist);
      padding: 24px 0;
      border-top: 1px solid var(--line-dark);
      text-align: center;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="wrap header-inner">
      <a href="/" class="brand">
        <img src="assets/logo.png" alt="Curelith">
        Curelith
      </a>
      <div class="doc-pill">
        Clinical Intake Portal
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main>
    <div class="wrap">
      
      <div class="upload-card">
        
        <!-- Patient Identity Strip -->
        <div class="patient-strip">
          <div>
            <span class="label">Verified Patient</span>
            <div id="patientName" class="name">Loading Patient...</div>
            <div id="patientInfo" class="id">ID: --</div>
          </div>
          <div id="patientBlood" class="blood">--</div>
        </div>

        <!-- Form -->
        <form id="uploadForm" class="form-content" onsubmit="handleUploadSubmit(event)">
          <input type="hidden" id="cardUuid">

          <div class="form-group">
            <label class="form-label">Doctor / Clinic Name <span class="req">*</span></label>
            <input type="text" id="doctorName" required placeholder="e.g. Dr. K. Sundaram / Apollo Clinic" class="input-field">
          </div>

          <div class="form-group">
            <label class="form-label">Hospital / Test Center</label>
            <input type="text" id="hospitalName" placeholder="e.g. Orthomed Hospital Chennai" class="input-field">
          </div>

          <div class="form-group">
            <label class="form-label">Prescription or Report File (PDF / Image) <span class="req">*</span></label>
            <input type="file" id="reportFile" required accept="image/*,application/pdf" class="input-field" style="padding: 8px;">
          </div>

          <div class="form-group">
            <label class="form-label">Clinical Advice / Diagnosis Notes</label>
            <textarea id="notes" placeholder="e.g. Lumbar spondylosis. Prescribed physiotherapy and muscle relaxants. Review in 10 days." class="input-field"></textarea>
          </div>

          <div>
            <button type="submit" id="submitBtn" class="btn-submit">
              Save to Patient Locker →
            </button>
            <div id="uploadStatus" style="display:none; font-family:var(--mono); font-size:12px; text-align:center; margin-top:10px; font-weight:600;"></div>
          </div>
        </form>

      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="wrap">
      <div>Curelith Clinical Security Infrastructure • Encrypted at Rest</div>
      <div style="font-family:var(--mono); font-size:11px; margin-top:4px; opacity:0.8;">www.curelith.com</div>
    </div>
  </footer>

  <script>
    async function initDoctorPortal() {
      const urlParams = new URLSearchParams(window.location.search);
      const cardId = urlParams.get('id') || 'CL-99992-610A';
      document.getElementById('cardUuid').value = cardId;

      try {
        const res = await fetch(`https://api.curelith.com/emergency/data/${cardId}`);
        const data = await res.json();
        if (data.success && data.card) {
          const c = data.card;
          document.getElementById('patientName').innerText = c.patient_name;
          document.getElementById('patientInfo').innerText = `ID: ${c.card_uuid} • Phone: +${c.patient_phone}`;
          document.getElementById('patientBlood').innerText = (c.blood_group || 'O+VE').replace('VE', 've');
        } else {
          document.getElementById('patientName').innerText = 'Patient: Card ID Not Found';
        }
      } catch (err) {
        document.getElementById('patientName').innerText = 'Patient: Error Loading Card';
      }
    }

    async function handleUploadSubmit(event) {
      event.preventDefault();
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('uploadStatus');
      btn.disabled = true;
      btn.innerText = 'Uploading Clinical File...';
      status.style.display = 'block';
      status.style.color = 'var(--pine)';
      status.innerText = 'Attaching to patient locker...';

      const formData = new FormData();
      formData.append('card_uuid', document.getElementById('cardUuid').value);
      formData.append('doctor_name', document.getElementById('doctorName').value);
      formData.append('hospital_name', document.getElementById('hospitalName').value);
      formData.append('notes', document.getElementById('notes').value);
      formData.append('file', document.getElementById('reportFile').files[0]);

      try {
        const res = await fetch('https://api.curelith.com/emergency/doctor-upload', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (data.success) {
          status.style.color = '#059669';
          status.innerText = '✅ Report successfully saved to patient Curelith locker!';
          document.getElementById('uploadForm').reset();
        } else {
          status.style.color = '#DC2626';
          status.innerText = `Error: ${data.error || 'Failed to upload'}`;
        }
      } catch (err) {
        status.style.color = '#DC2626';
        status.innerText = `Network Error: ${err.message}`;
      } finally {
        btn.disabled = false;
        btn.innerText = 'Save to Patient Locker →';
      }
    }

    initDoctorPortal();
  </script>
</body>
</html>
