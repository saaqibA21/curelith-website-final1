<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curelith Doctor Portal — Clinical Record Upload</title>
  <link rel="icon" href="assets/favicon-32x32.png" sizes="32x32" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-[#050814] text-slate-100 min-h-screen p-4 sm:p-6 flex flex-col justify-between selection:bg-teal-500 selection:text-slate-900">

  <!-- Header -->
  <header class="max-w-xl w-full mx-auto mb-4">
    <div class="bg-teal-950/40 border border-teal-500/40 rounded-2xl p-4 flex items-center justify-between shadow-lg">
      <div class="flex items-center gap-3">
        <span class="text-xl">🩺</span>
        <div>
          <div class="text-xs font-black uppercase tracking-widest text-teal-300">Curelith Clinical Network</div>
          <div class="text-sm font-extrabold text-white">Doctor & Lab Intake Portal</div>
        </div>
      </div>
      <a href="/" class="shrink-0">
        <img src="assets/logo.png" alt="Curelith" class="h-6 w-auto brightness-125">
      </a>
    </div>
  </header>

  <!-- Main Upload Area -->
  <main class="max-w-xl w-full mx-auto">
    <div class="bg-slate-900/90 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-xl">
      
      <!-- Patient Identity Box -->
      <div class="flex items-center justify-between pb-5 border-b border-slate-800 mb-6">
        <div>
          <span class="text-[10px] uppercase font-mono font-bold text-teal-400 bg-teal-950/80 px-2 py-0.5 rounded border border-teal-500/30">
            Card Verified
          </span>
          <h2 id="patientName" class="text-xl font-black text-white mt-1">Patient: Loading...</h2>
          <p id="patientInfo" class="text-xs text-slate-400 font-mono mt-0.5">ID: --</p>
        </div>
        <div class="text-right">
          <span class="text-[9px] uppercase font-bold text-slate-400 block">Blood Group</span>
          <span id="patientBlood" class="text-lg font-black text-rose-400">--</span>
        </div>
      </div>

      <!-- Upload Form -->
      <form id="uploadForm" class="space-y-5" onsubmit="handleUploadSubmit(event)">
        <input type="hidden" id="cardUuid">

        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">
            Doctor / Clinic Name <span class="text-rose-400">*</span>
          </label>
          <input type="text" id="doctorName" required placeholder="e.g. Dr. K. Sundaram / Apollo Clinic"
            class="w-full px-4 py-2.5 bg-slate-800/90 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-teal-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">
            Hospital / Diagnostics Center
          </label>
          <input type="text" id="hospitalName" placeholder="e.g. Orthomed Hospital Chennai"
            class="w-full px-4 py-2.5 bg-slate-800/90 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-teal-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">
            Attach Prescription or Diagnostic Report (PDF / Image) <span class="text-rose-400">*</span>
          </label>
          <input type="file" id="reportFile" required accept="image/*,application/pdf"
            class="w-full text-xs text-slate-400 file:mr-3 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-teal-500/10 file:text-teal-400 hover:file:bg-teal-500/20 bg-slate-800/50 p-2 rounded-xl border border-slate-700">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">
            Clinical Notes / Diagnosis / Advice
          </label>
          <textarea id="notes" rows="3" placeholder="e.g. Acute Lumbago prescribed NSAIDs. Advised lumbar spine MRI if pain persists."
            class="w-full px-4 py-2.5 bg-slate-800/90 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-teal-500"></textarea>
        </div>

        <div>
          <button type="submit" id="submitBtn"
            class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-teal-500 to-emerald-500 hover:from-teal-400 hover:to-emerald-400 text-slate-950 font-black text-sm uppercase tracking-wider shadow-lg shadow-teal-500/25 transition flex items-center justify-center gap-2">
            <span>Securely Save to Patient Locker</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
            </svg>
          </button>
          <p id="uploadStatus" class="text-xs text-center mt-2 text-slate-400 hidden"></p>
        </div>
      </form>

    </div>
  </main>

  <footer class="max-w-xl w-full mx-auto mt-6 text-center text-slate-500 text-xs py-2">
    <div>Curelith Clinical Security Infrastructure • Encrypted at Rest</div>
    <div class="text-[10px] text-slate-600 mt-1">www.curelith.com</div>
  </footer>

  <script>
    async function initDoctorPortal() {
      const urlParams = new URLSearchParams(window.location.search);
      const cardId = urlParams.get('id') || 'CL-99992-610A';
      document.getElementById('cardUuid').value = cardId;

      try {
        const res = await fetch(`https://api.curelith.com/emergency/data/${cardId}`);
        const data = await res.json();
        if (data.success && data.card) {
          const c = data.card;
          document.getElementById('patientName').innerText = `Patient: ${c.patient_name}`;
          document.getElementById('patientInfo').innerText = `ID: ${c.card_uuid} • Phone: ${c.patient_phone}`;
          document.getElementById('patientBlood').innerText = (c.blood_group || 'O+VE').replace('VE', 've');
        } else {
          document.getElementById('patientName').innerText = 'Patient: Card ID Not Found';
        }
      } catch (err) {
        document.getElementById('patientName').innerText = 'Patient: Error Loading Card';
      }
    }

    async function handleUploadSubmit(event) {
      event.preventDefault();
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('uploadStatus');
      btn.disabled = true;
      btn.innerText = 'Uploading Clinical File...';
      status.className = 'text-xs text-center mt-2 text-teal-400 block';
      status.innerText = 'Uploading to patient locker...';

      const formData = new FormData();
      formData.append('card_uuid', document.getElementById('cardUuid').value);
      formData.append('doctor_name', document.getElementById('doctorName').value);
      formData.append('hospital_name', document.getElementById('hospitalName').value);
      formData.append('notes', document.getElementById('notes').value);
      formData.append('file', document.getElementById('reportFile').files[0]);

      try {
        const res = await fetch('https://api.curelith.com/emergency/doctor-upload', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (data.success) {
          status.className = 'text-xs text-center mt-2 text-emerald-400 font-bold block';
          status.innerText = '✅ Report successfully saved to patient Curelith locker!';
          document.getElementById('uploadForm').reset();
        } else {
          status.className = 'text-xs text-center mt-2 text-rose-400 font-bold block';
          status.innerText = `Error: ${data.error || 'Failed to upload'}`;
        }
      } catch (err) {
        status.className = 'text-xs text-center mt-2 text-rose-400 font-bold block';
        status.innerText = `Network Error: ${err.message}`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>Securely Save to Patient Locker</span><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>`;
      }
    }

    initDoctorPortal();
  </script>
</body>
</html>
