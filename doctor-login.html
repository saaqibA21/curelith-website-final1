<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login | Curelith Clinical</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #F3EEE4;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #1B3A36;
        }

        .login-card {
            background: white;
            padding: 4rem;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(27, 58, 54, 0.05);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid #DDD6C4;
        }

        h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        p { color: #4F5D57; margin-bottom: 3rem; }

        .input-group { text-align: left; margin-bottom: 1.5rem; }
        .input-group label { display: block; font-size: 0.75rem; color: #4F5D57; text-transform: uppercase; margin-bottom: 8px; font-weight: 700; }

        input {
            width: 100%;
            padding: 1.2rem;
            background: #FAF9F4;
            border: 1px solid #DDD6C4;
            border-radius: 15px;
            font-family: inherit;
            outline: none;
            box-sizing: border-box;
        }

        input:focus { border-color: #4C7F6D; }

        button {
            width: 100%;
            padding: 1.2rem;
            background: #1B3A36;
            color: white;
            border: none;
            border-radius: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1rem;
        }

        button:hover { background: #4C7F6D; }
        .footer-link { margin-top: 2rem; display: block; color: #4F5D57; text-decoration: none; font-size: 0.9rem; }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 3.5rem;
        }

        .toggle-password {
            position: absolute;
            right: 1.2rem;
            background: none !important;
            border: none !important;
            padding: 0 !important;
            margin: 0 !important;
            width: 24px !important;
            height: 24px !important;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4F5D57;
            box-shadow: none !important;
            transform: none !important;
        }

        .toggle-password:hover {
            color: #1B3A36;
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="assets/logo.png" style="height: 60px; margin-bottom: 2rem;" alt="Curelith">
        <h1>Doctor Portal</h1>
        <p>Authenticate to access clinical records.</p>
        
        <form id="docForm">
            <div class="input-group">
                <label>Professional Name</label>
                <input type="text" id="docName" placeholder="Dr. Name" required>
            </div>
            <div class="input-group">
                <label>Secure Key</label>
                <div class="password-wrapper">
                    <input type="password" id="docPass" placeholder="Password" required>
                    <button type="button" class="toggle-password" id="togglePass">
                        <svg class="eye-icon" viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="eye-off-icon" viewBox="0 0 24 24" style="display: none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>
            <div id="errMsg" style="color: #f43f5e; font-size: 0.85rem; margin-bottom: 1rem; display: none;"></div>
            <button type="submit" id="loginBtn">Initialize Session</button>
        </form>
        <a href="index.html" class="footer-link">← Return Home</a>
    </div>

    <script>
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const API_BASE = isLocal ? "http://localhost:5000" : "https://api.curelith.com";

        // Auto-redirect if session is active
        const doctorNameVal = localStorage.getItem('doctor_name');
        const doctorPassVal = localStorage.getItem('doctor_password');
        const doctorExpiry = localStorage.getItem('doctor_expiry');
        if (doctorNameVal && doctorPassVal && doctorExpiry && Date.now() < parseInt(doctorExpiry)) {
            window.location.replace('doctor-dashboard.html');
        } else {
            // Clear old session info if expired
            ['doctor_name','doctor_password','doctor_id','doctor_expiry'].forEach(k => localStorage.removeItem(k));
        }

        document.getElementById('docForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('docName').value;
            const pass = document.getElementById('docPass').value;
            const btn = document.getElementById('loginBtn');
            const err = document.getElementById('errMsg');

            btn.innerText = "Verifying...";
            err.style.display = 'none';

            try {
                const res = await fetch(`${API_BASE}/doctor/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, password: pass })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    localStorage.setItem('doctor_name', data.doctor.name);
                    localStorage.setItem('doctor_id', data.doctor.id);
                    localStorage.setItem('doctor_password', pass);
                    localStorage.setItem('doctor_expiry', (Date.now() + 7 * 24 * 60 * 60 * 1000).toString()); // 7 days
                    window.location.replace('doctor-dashboard.html');
                } else {
                    err.innerText = "Invalid credentials.";
                    err.style.display = 'block';
                    btn.innerText = "Initialize Session";
                }
            } catch (e) {
                err.innerText = "Connection failure.";
                err.style.display = 'block';
                btn.innerText = "Initialize Session";
            }
        });

        // Toggle password visibility
        const togglePass = document.getElementById('togglePass');
        const docPass = document.getElementById('docPass');
        const eyeIcon = togglePass.querySelector('.eye-icon');
        const eyeOffIcon = togglePass.querySelector('.eye-off-icon');

        togglePass.addEventListener('click', () => {
            const isPassword = docPass.getAttribute('type') === 'password';
            docPass.setAttribute('type', isPassword ? 'text' : 'password');
            eyeIcon.style.display = isPassword ? 'none' : 'block';
            eyeOffIcon.style.display = isPassword ? 'block' : 'none';
        });
    </script>
</body>
</html>
