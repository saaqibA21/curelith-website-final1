<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login | Curelith Secure</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
        }

        body {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Outfit', sans-serif;
            color: white;
            overflow: hidden;
        }

        .login-container {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(25px);
            padding: 4rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.5);
        }

        h1 { font-size: 2.2rem; margin-bottom: 0.8rem; font-weight: 700; }
        p { color: #94a3b8; margin-bottom: 3rem; }

        .input-group { text-align: left; margin-bottom: 1.5rem; }
        .input-group label { display: block; font-size: 0.8rem; color: #64748b; margin-bottom: 10px; font-weight: 600; letter-spacing: 0.05em; }

        input {
            width: 100%;
            padding: 1.2rem;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            color: white;
            font-family: inherit;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2); }

        .btn-login {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            width: 100%;
            padding: 1.2rem;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }

        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 15px 35px rgba(99, 102, 241, 0.4); }

        .footer-links { margin-top: 2rem; }
        .footer-links a { color: #64748b; text-decoration: none; font-size: 0.9rem; }
        .footer-links a:hover { color: white; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Doctor Portal</h1>
        <p>Authenticate to access clinical data.</p>
        
        <form id="doctorLoginForm">
            <div class="input-group">
                <label>PROFESSIONAL NAME</label>
                <input type="text" id="doctorName" placeholder="Dr. Full Name" required>
            </div>
            <div class="input-group">
                <label>ENCRYPTION KEY</label>
                <input type="password" id="doctorPassword" placeholder="Unique Password" required>
            </div>
            <div id="loginError" style="color: #f43f5e; font-size: 0.85rem; margin-bottom: 1rem; display: none;"></div>
            <button type="submit" class="btn-login" id="loginBtn">Initialize Dashboard</button>
        </form>

        <div class="footer-links">
            <a href="index.html">← Return to Homepage</a>
        </div>
    </div>

    <script>
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === '';
        const API_BASE = isLocal ? "http://localhost:5000" : "https://api.curelith.com";

        document.getElementById('doctorLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('doctorName').value;
            const password = document.getElementById('doctorPassword').value;
            const errorDiv = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');

            errorDiv.style.display = 'none';
            btn.innerText = 'Verifying Protocol...';
            btn.disabled = true;
            
            try {
                const response = await fetch(`${API_BASE}/doctor/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, password })
                });
                const result = await response.json();
                if (result.status === 'success') {
                    localStorage.setItem('doctor_name', result.doctor.name);
                    localStorage.setItem('doctor_id', result.doctor.id);
                    localStorage.setItem('doctor_password', password);
                    window.location.href = 'doctor-dashboard.html';
                } else {
                    errorDiv.innerText = result.message || 'Access Denied: Invalid Credentials';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.innerText = 'Uplink Error. Check network.';
                errorDiv.style.display = 'block';
            } finally {
                btn.innerText = 'Initialize Dashboard';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
