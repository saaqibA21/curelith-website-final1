<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curelith | Personal Medical Locker</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --accent: #10b981;
            --bg: #0f172a;
            --card: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-dim: #94a3b8;
        }

        * { box-sizing: border-box; transition: all 0.3s; }

        body {
            background: #0f172a;
            margin: 0;
            font-family: 'Outfit', sans-serif;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .locker-container {
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            text-align: center;
        }

        .glass-card {
            background: var(--card);
            backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
        p { color: var(--text-dim); margin-bottom: 2.5rem; }

        input {
            width: 100%;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: white;
            font-family: inherit;
            outline: none;
        }

        input:focus { border-color: var(--primary); }

        .btn-action {
            width: 100%;
            padding: 1.2rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
        }

        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3); }

        /* Report List */
        .report-list { text-align: left; margin-top: 2rem; display: none; }
        .report-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 1.2rem;
            border-radius: 20px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }

        .report-item:hover { background: rgba(255, 255, 255, 0.08); }
        .report-item i { color: var(--primary); }

        .btn-logout { margin-top: 2rem; display: none; color: var(--text-dim); text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="locker-container">
        <div class="glass-card" id="loginCard">
            <i data-lucide="lock" style="width: 50px; height: 50px; color: var(--primary); margin-bottom: 1.5rem;"></i>
            <h1>Medical Locker</h1>
            <p>Enter your phone number to access your secure medical data.</p>
            
            <div id="phoneStep">
                <input type="text" id="phoneNum" placeholder="Phone Number (e.g. 91...)" required>
                <button class="btn-action" onclick="sendOtp()">Send Access Code</button>
            </div>

            <div id="otpStep" style="display: none;">
                <input type="text" id="otpCode" placeholder="Enter 4-digit code" maxlength="4">
                <button class="btn-action" onclick="verifyOtp()">Verify & Unlock</button>
            </div>
        </div>

        <div class="glass-card" id="dashboardCard" style="display: none; max-width: 600px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h2 style="margin: 0;">My Records</h2>
                <i data-lucide="shield-check" style="color: var(--accent);"></i>
            </div>
            <div id="reportsContainer" class="report-list" style="display: block;">
                <!-- Loaded via API -->
            </div>
            <a href="#" class="btn-logout" id="logoutBtn" onclick="logout()" style="display: inline-block;">Exit Secure Session</a>
        </div>
    </div>

    <script>
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === '';
        const API_BASE = isLocal ? "http://localhost:5000" : "https://api.curelith.com";
        let currentPhone = "";

        function initIcons() { try { lucide.createIcons(); } catch(e) {} }

        function sendOtp() {
            currentPhone = document.getElementById('phoneNum').value;
            if (!currentPhone) return alert("Phone number required");
            
            document.getElementById('phoneStep').style.display = 'none';
            document.getElementById('otpStep').style.display = 'block';
            document.querySelector('#loginCard p').innerText = `Access code sent to ${currentPhone} (Simulated: use 1234)`;
        }

        async function verifyOtp() {
            const code = document.getElementById('otpCode').value;
            if (code !== "1234") return alert("Invalid Access Code");

            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('dashboardCard').style.display = 'block';
            loadReports();
        }

        async function loadReports() {
            const container = document.getElementById('reportsContainer');
            container.innerHTML = '<p>Decrypting data packets...</p>';
            
            try {
                const res = await fetch(`${API_BASE}/locker/list/${currentPhone}`);
                const data = await res.json();
                
                container.innerHTML = data.length ? '' : '<p>No reports found in your locker.</p>';
                
                data.forEach(r => {
                    const div = document.createElement('div');
                    div.className = 'report-item';
                    div.onclick = () => window.open(`${API_BASE}${r.file_path}`, '_blank');
                    const icon = r.file_type === 'pdf' ? 'file-text' : 'image';
                    div.innerHTML = `
                        <i data-lucide="${icon}"></i>
                        <div>
                            <div style="font-weight: 600;">${r.original_name}</div>
                            <div style="font-size: 0.8rem; color: var(--text-dim);">${new Date(r.uploaded_at).toLocaleDateString()}</div>
                        </div>
                    `;
                    container.appendChild(div);
                });
                initIcons();
            } catch (err) {
                container.innerHTML = '<p style="color: #f43f5e;">Access Denied: Uplink Failure.</p>';
            }
        }

        function logout() { location.reload(); }
        document.addEventListener('DOMContentLoaded', initIcons);
    </script>
</body>
</html>
