<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curelith | Patient Locker</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --cl-primary: #1B3A36;
            --cl-accent: #4C7F6D;
            --cl-bg: #F3EEE4;
            --cl-text: #1B3A36;
        }

        body {
            background: var(--cl-bg); margin: 0;
            font-family: 'Outfit', sans-serif;
            color: var(--cl-text);
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh;
        }

        .locker-card {
            background: white; padding: 4rem; border-radius: 40px;
            box-shadow: 0 20px 50px rgba(27, 58, 54, 0.05);
            width: 100%; max-width: 450px; text-align: center;
            border: 1px solid #DDD6C4;
        }

        h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
        p { color: #4F5D57; margin-bottom: 3rem; }

        input {
            width: 100%; padding: 1.2rem; margin-bottom: 1.2rem;
            background: #FAF9F4; border: 1px solid #DDD6C4; border-radius: 15px;
            font-family: inherit; outline: none; box-sizing: border-box;
        }

        .btn-action {
            width: 100%; padding: 1.2rem; background: var(--cl-primary);
            color: white; border: none; border-radius: 15px; font-weight: 700;
            cursor: pointer;
        }

        .report-item {
            background: #FAF9F4; padding: 1.2rem; border-radius: 15px;
            margin-bottom: 1rem; display: flex; align-items: center; gap: 15px;
            cursor: pointer; text-align: left; border: 1px solid #DDD6C4;
        }
    </style>
</head>
<body>
    <div class="locker-card">
        <div id="loginSection">
            <i data-lucide="lock" style="width: 50px; height: 50px; color: var(--cl-accent); margin-bottom: 1.5rem;"></i>
            <h1>Patient Locker</h1>
            <p>Access your secure clinical records.</p>
            <div id="pStep">
                <input type="text" id="pNum" placeholder="Phone Number (91...)">
                <button class="btn-action" onclick="go()">Access Locker</button>
            </div>
            <div id="oStep" style="display:none;">
                <input type="text" id="oCode" placeholder="OTP (1234)">
                <button class="btn-action" onclick="verify()">Unlock</button>
            </div>
        </div>
        <div id="dashSection" style="display:none;">
            <h2>My Reports</h2>
            <div id="rList" style="margin-top: 2rem;"></div>
            <button class="btn-action" style="margin-top: 2rem; background: #FAF9F4; color: var(--cl-text);" onclick="location.reload()">Exit</button>
        </div>
    </div>

    <script>
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const API_BASE = isLocal ? "http://localhost:5000" : "https://api.curelith.com";
        let phone = "";

        function go() {
            phone = document.getElementById('pNum').value;
            if(!phone) return;
            document.getElementById('pStep').style.display = 'none';
            document.getElementById('oStep').style.display = 'block';
        }

        async function verify() {
            if(document.getElementById('oCode').value !== "1234") return alert("Wrong code.");
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashSection').style.display = 'block';
            load();
        }

        async function load() {
            const l = document.getElementById('rList');
            l.innerHTML = "Fetching...";
            try {
                const res = await fetch(`${API_BASE}/locker/list/${phone}`);
                const data = await res.json();
                l.innerHTML = data.length ? '' : 'No reports found.';
                data.forEach(r => {
                    const d = document.createElement('div'); d.className = 'report-item';
                    d.onclick = () => window.open(`${API_BASE}${r.file_path}`, '_blank');
                    const ic = r.file_type === 'pdf' ? 'file-text' : 'image';
                    d.innerHTML = `<i data-lucide="${ic}"></i><div><strong>${r.original_name}</strong><br><small>${new Date(r.uploaded_at).toLocaleDateString()}</small></div>`;
                    l.appendChild(d);
                });
                lucide.createIcons();
            } catch (e) { l.innerHTML = "Error."; }
        }
        document.addEventListener('DOMContentLoaded', () => lucide.createIcons());
    </script>
</body>
</html>
