<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curelith | Admin Command Node</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <style>
        :root {
            --admin-primary: #1B3A36;
            --admin-accent: #4C7F6D;
            --admin-bg: #F3EEE4;
            --admin-card: #FFFFFF;
            --admin-text: #1B3A36;
            --admin-text-dim: #4F5D57;
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }

        body {
            background-color: var(--admin-bg);
            margin: 0;
            display: flex;
            min-height: 100vh;
            font-family: 'Outfit', sans-serif;
            color: var(--admin-text);
        }

        /* Sidebar - Solid Calm Green */
        .sidebar {
            width: 280px;
            background: var(--admin-primary);
            padding: 2.5rem 1.5rem;
            display: flex;
            flex-direction: column;
            color: white;
            box-shadow: 10px 0 30px rgba(0,0,0,0.05);
        }

        .sidebar h2 {
            font-size: 1.8rem;
            margin-bottom: 3.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 1.1rem 1.3rem;
            border-radius: 15px;
            margin-bottom: 0.8rem;
            cursor: pointer;
            color: #AFC7BC;
            text-decoration: none;
            font-weight: 500;
        }

        .nav-item:hover { background: rgba(255, 255, 255, 0.05); color: white; transform: translateX(5px); }
        .nav-item.active { background: var(--admin-accent); color: white; }

        /* Main Workspace */
        .main-workspace {
            flex: 1;
            padding: 3rem 4rem;
            overflow-y: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4rem;
        }

        .admin-pill {
            background: white;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid #DDD6C4;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .stat-card {
            background: white;
            padding: 2.5rem;
            border-radius: 25px;
            border: 1px solid #DDD6C4;
            position: relative;
        }

        .stat-card h3 { margin: 0; font-size: 0.8rem; color: var(--admin-text-dim); text-transform: uppercase; letter-spacing: 0.1em; }
        .stat-card .value { font-size: 2.5rem; font-weight: 700; margin-top: 1rem; color: var(--admin-primary); }

        /* Chart & Tables */
        .white-panel {
            background: white;
            border-radius: 30px;
            padding: 2.5rem;
            border: 1px solid #DDD6C4;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
            margin-bottom: 3rem;
        }

        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem; }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 1.2rem; color: var(--admin-text-dim); border-bottom: 1px solid #F3EEE4; font-size: 0.8rem; text-transform: uppercase; }
        td { padding: 1.5rem 1.2rem; border-bottom: 1px solid #F3EEE4; }

        .btn-action {
            background: var(--admin-bg);
            border: 1px solid #DDD6C4;
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            color: var(--admin-text);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-action:hover { background: var(--admin-accent); color: white; border-color: var(--admin-accent); }

        /* Status Badges */
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .status-active { background: #10b981; }
        .status-inactive { background: #f43f5e; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #DDD6C4; border-radius: 10px; }

        .search-box {
            background: var(--admin-bg);
            border: 1px solid #DDD6C4;
            padding: 0.8rem 1.5rem;
            border-radius: 15px;
            width: 300px;
            outline: none;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2><i data-lucide="shield-check"></i> Curelith</h2>
        <div class="nav-item active" onclick="showView('overview')"><i data-lucide="layout-dashboard"></i> Overview</div>
        <div class="nav-item" onclick="showView('doctors')"><i data-lucide="users"></i> Doctors</div>
        <div class="nav-item" onclick="showView('activity')"><i data-lucide="activity"></i> Activity Logs</div>
        
        <div style="margin-top: auto;">
            <div class="nav-item" onclick="logout()"><i data-lucide="log-out"></i> Logout</div>
        </div>
    </div>

    <div class="main-workspace">
        <header>
            <div>
                <h1 style="margin: 0; font-size: 2rem;">Admin Command</h1>
                <p style="color: var(--admin-text-dim); margin-top: 5px;">Platform Governance & Intelligence</p>
            </div>
            <div class="admin-pill">
                <i data-lucide="user-circle"></i>
                <span style="font-weight: 600;">System Admin</span>
            </div>
        </header>

        <div id="view-overview">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>ACTIVE DOCTORS</h3>
                    <div class="value" id="statActiveDocs">0</div>
                </div>
                <div class="stat-card">
                    <h3>CONSULTATIONS</h3>
                    <div class="value" id="statTotalConsults">0</div>
                </div>
                <div class="stat-card">
                    <h3>DATA INTERROGATIONS</h3>
                    <div class="value" id="statTotalViews">0</div>
                </div>
            </div>

            <div class="white-panel">
                <h3>Global Activity Metrics</h3>
                <canvas id="activityChart" height="100"></canvas>
            </div>
        </div>

        <div id="view-doctors" style="display: none;">
            <div class="white-panel">
                <div class="panel-header">
                    <h2>Professional Directory</h2>
                    <input type="text" class="search-box" placeholder="Filter by name/speciality..." onkeyup="filterDocs(this.value)">
                </div>
                <table id="doctorsTable">
                    <thead>
                        <tr>
                            <th>IDENTIFIER</th>
                            <th>SPECIALITY</th>
                            <th>NODE</th>
                            <th>STATUS</th>
                            <th>ENGAGEMENT</th>
                        </tr>
                    </thead>
                    <tbody id="doctorsList"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const adminPass = localStorage.getItem('admin_pass');
        if (!adminPass) window.location.href = 'admin-login.html';

        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === '';
        const API_BASE = isLocal ? "http://localhost:5000" : "https://api.curelith.com";
        const headers = { 'X-Admin-Password': adminPass };

        let allDoctors = [];

        function initIcons() { try { lucide.createIcons(); } catch(e) {} }

        function showView(view) {
            document.getElementById('view-overview').style.display = view === 'overview' ? 'block' : 'none';
            document.getElementById('view-doctors').style.display = view === 'doctors' ? 'block' : 'none';
            
            document.querySelectorAll('.nav-item').forEach(i => {
                i.classList.remove('active');
                if (i.innerText.toLowerCase().includes(view)) i.classList.add('active');
            });

            if (view === 'overview') loadGlobalStats();
            if (view === 'doctors') loadDoctors();
        }

        async function loadGlobalStats() {
            try {
                const res = await fetch(`${API_BASE}/doctor/admin/stats`, { headers });
                const data = await res.json();
                
                document.getElementById('statActiveDocs').innerText = data.active_doctors;
                document.getElementById('statTotalConsults').innerText = data.total_consultations;
                document.getElementById('statTotalViews').innerText = data.total_record_views;

                renderChart(data.daily_activity);
            } catch (err) { console.error(err); }
        }

        function renderChart(daily) {
            const ctx = document.getElementById('activityChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: daily.map(d => d.date).reverse(),
                    datasets: [{
                        label: 'Record Views',
                        data: daily.map(d => d.count).reverse(),
                        borderColor: '#1B3A36',
                        backgroundColor: 'rgba(27, 58, 54, 0.05)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true }, x: { grid: { display: false } } }
                }
            });
        }

        async function loadDoctors() {
            try {
                const res = await fetch(`${API_BASE}/doctor/admin/doctors`, { headers });
                allDoctors = await res.json();
                renderDoctors(allDoctors);
            } catch (err) { console.error(err); }
        }

        function renderDoctors(docs) {
            const list = document.getElementById('doctorsList');
            list.innerHTML = '';
            docs.forEach(doc => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight: 600;">${doc.name}</td>
                    <td>${doc.speciality}</td>
                    <td>${doc.location}</td>
                    <td>
                        <span class="status-dot ${doc.is_active ? 'status-active' : 'status-inactive'}"></span>
                        ${doc.is_active ? 'Online' : 'Offline'}
                    </td>
                    <td>${doc.consultations_completed} consults</td>
                `;
                list.appendChild(tr);
            });
            initIcons();
        }

        function filterDocs(q) {
            const f = allDoctors.filter(d => d.name.toLowerCase().includes(q.toLowerCase()) || d.speciality.toLowerCase().includes(q.toLowerCase()));
            renderDoctors(f);
        }

        function logout() { localStorage.clear(); window.location.href = 'admin-login.html'; }

        document.addEventListener('DOMContentLoaded', () => { showView('overview'); initIcons(); });
    </script>
</body>
</html>
