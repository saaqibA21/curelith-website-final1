<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Profile – Curelith</title>
  <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="assets/logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

</head>
<body>

  <div class="profile-container">
    <button class="back-btn" onclick="window.location.href='home.html'">← Back to Home</button>
    <h2>👤 User Profile</h2>
    <div class="profile-info" id="profileInfo">
      <p><strong>Loading...</strong></p>
    </div>
    <div class="profile-buttons">
      <button class="logout-btn" onclick="logout()">Logout</button>
      <button class="backup-btn" onclick="downloadBackup()">Download Backup</button>
    </div>
  </div>

<script>
  const BASE_URL = "https://2f9d944b9b9b.ngrok-free.app";
  const token = localStorage.getItem("token");

  if (!token) {
    alert("You are not logged in");
    window.location.href = "login.html";
  }

  // Helper: safely parse JSON only if content-type is JSON
  async function parseJsonIfPossible(res) {
    const ct = res.headers.get("content-type") || "";
    if (ct.includes("application/json")) {
      return await res.json();
    }
    // fall back to text so we can see what came back (often HTML)
    const text = await res.text();
    throw new Error(`Non-JSON response (${res.status} ${res.statusText}): ${text.slice(0, 400)}`);
  }

  async function fetchProfile() {
    try {
      const res = await fetch(`${BASE_URL}/api/auth1/me`, {
        headers: {
          Authorization: "Bearer " + token,
          "Accept": "application/json",
          // ngrok sometimes shows a browser warning page unless this header is present
          "ngrok-skip-browser-warning": "true",
        },
      });

      const data = await parseJsonIfPossible(res);

      if (res.ok) {
        const html = `
          <p><strong>Name:</strong> ${data.name}</p>
          <p><strong>Email:</strong> ${data.email}</p>
          <p><strong>Joined:</strong> ${data.created_at}</p>
          <p><strong>User ID:</strong> ${data.user_id}</p>
        `;
        document.getElementById("profileInfo").innerHTML = html;
      } else {
        alert(`⚠️ Failed to load profile: ${res.status}`);
      }
    } catch (err) {
      console.error("❌ Error loading profile:", err);
      alert("Server error while loading profile. Check console for details.");
    }
  }

  async function downloadBackup() {
    try {
      const res = await fetch(`${BASE_URL}/api/admin/backup`, {
        headers: {
          Authorization: "Bearer " + token,   // likely required
          "Accept": "application/json",
          "ngrok-skip-browser-warning": "true",
        },
      });

      const ct = res.headers.get("content-type") || "";
      if (!res.ok) {
        const text = await res.text();
        throw new Error(`Backup failed (${res.status}): ${text.slice(0, 400)}`);
      }

      if (ct.includes("application/json")) {
        const data = await res.json();
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "curelith_backup.json";
        a.click();
        URL.revokeObjectURL(url);
      } else {
        // If server returns a file stream, just save it as-is
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "curelith_backup.json";
        a.click();
        URL.revokeObjectURL(url);
      }
    } catch (err) {
      console.error(err);
      alert("❌ Could not download backup. Check console for details.");
    }
  }

  function logout() {
    localStorage.removeItem("token");
    alert("You have been logged out.");
    window.location.href = "index.html";
  }

  window.logout = logout;
  window.downloadBackup = downloadBackup;
  fetchProfile();
</script>

</body>
</html>
